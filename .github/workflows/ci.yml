name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run size

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser download once hung for 17 minutes: cache the browsers per
      # OS and @playwright/test version (read from the lockfile) and only
      # install the system libraries when the cache hits.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browsers and system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install system libraries (browsers are cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The visual job runs inside the official Playwright image of the SAME
  # version as @playwright/test (read from the lockfile): same browser build,
  # same system fonts, so the baseline images match pixel for pixel on every run.
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  visual:
    name: Visual regression
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only before the very first baselines exist (bootstrap): the update
      # workflow can only be dispatched once it is on main, so the PR that
      # adds it cannot have them yet. Once any baseline exists, a missing one
      # for a single screen fails below like any difference.
      - name: Check that the baseline images exist
        id: baselines
        run: |
          if ls e2e/__screenshots__/baseline/*.png > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Aún no hay imágenes base::No hay imágenes base de regresión visual en e2e/__screenshots__/baseline, así que no se comparó nada. Corre el workflow 'Update visual snapshots' sobre una rama de trabajo (Actions > Update visual snapshots > Run workflow). Ver docs/testing.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # 'none': a missing or different image fails the job; nothing is written.
      - name: Visual regression
        if: steps.baselines.outputs.present == 'true'
        run: npm run test:visual -- --update-snapshots=none
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            playwright-report
            test-results
          retention-days: 7
